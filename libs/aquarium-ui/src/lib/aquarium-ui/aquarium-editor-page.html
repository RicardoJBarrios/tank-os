<p>aquarium-editor-page works!</p>
<main>
  <h1>Create aquarium</h1>
  <form (ngSubmit)="submit()">
    <label for="aquarium-name">Name</label>
    <input
      id="aquarium-name"
      name="name"
      [(ngModel)]="name"
      required
      maxlength="120"
    />
    <button type="submit" [disabled]="!name.trim() || service.saving()">
      Create
    </button>
    <a routerLink="/aquariums">Cancel</a>
  </form>
</main>
