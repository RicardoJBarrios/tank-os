<main class="aquarium-editor-page" data-testid="aquarium-editor">
  <a class="back-link" routerLink="/aquariums">← Back to aquariums</a>
  <section class="editor-card">
    <p class="eyebrow">Aquarium setup</p>
    <h1>{{ editing ? 'Edit aquarium' : 'Create aquarium' }}</h1>
    <p class="page-intro">
      Give this system a name. You can add its display, sump, zones and
      connections afterwards.
    </p>
    <form data-testid="aquarium-form" (submit)="submit($event)">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input
          matInput
          data-testid="aquarium-name"
          id="aquarium-name"
          name="name"
          [value]="name"
          (input)="updateName($event)"
          [disabled]="loading()"
          required
          maxlength="120"
          autocomplete="off"
        />
        <mat-hint>Use a name that helps you identify the system.</mat-hint>
      </mat-form-field>
      <div class="form-actions">
        <button
          mat-flat-button
          color="primary"
          data-testid="aquarium-save"
          type="submit"
          [disabled]="loading() || service.saving()"
        >
          {{ loading() ? 'Loading…' : service.saving() ? 'Saving…' : editing ?
          'Save changes' : 'Create aquarium' }}
        </button>
        <a mat-stroked-button routerLink="/aquariums">Cancel</a>
      </div>
    </form>
  </section>
</main>
