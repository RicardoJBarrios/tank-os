<main class="aquarium-detail-page" data-testid="aquarium-detail-page">
  <a class="back-link" routerLink="/aquariums">Back to aquariums</a>
  @if (loading()) {
  <tankos-state-card state="loading" title="Loading aquarium…" />
  } @else if (aquarium(); as currentAquarium) {
  <tankos-page-header
    eyebrow="Aquarium workspace"
    [title]="currentAquarium.name"
    description="Your system overview and configuration workspace."
  >
    <span class="status-badge">Accessible</span>
  </tankos-page-header>
  <section class="overview-card">
    <div class="overview-icon" aria-hidden="true">◉</div>
    <div>
      <h2>System overview</h2>
      <p>
        Define the physical areas and connections that make up this aquarium.
      </p>
    </div>
  </section>
  <section class="detail-section">
    <h2>Configuration</h2>
    <p>
      Components, zones and system links will be managed from this workspace.
    </p>
  </section>
  } @else {
  <tankos-state-card
    state="not-found"
    title="Aquarium not found."
    message="This aquarium may have been removed or is no longer available to you."
  />
  }
</main>
