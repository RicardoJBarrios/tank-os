<section
  class="state-card"
  [class.state-card-error]="state() === 'error' || state() === 'not-found'"
  [attr.role]="state() === 'error' || state() === 'not-found' ? 'alert' : null"
>
  <span class="state-icon" aria-hidden="true">{{
    state() === 'error' || state() === 'not-found'
      ? '!'
      : state() === 'empty'
        ? '◎'
        : '◌'
  }}</span>
  <h2>{{ title() }}</h2>
  @if (message()) {
    <p>{{ message() }}</p>
  }
  <div class="actions"><ng-content /></div>
</section>
